[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
board_build.partitions = min_spiffs.csv
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
lib_deps = 
    sandeepmistry/LoRa @ ^0.8.0
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4
